# New-API Docker Compose Configuration
# 
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and SQL_DSN line 15
#   2. Uncomment the mysql service and SQL_DSN line 16
#   3. Uncomment mysql in depends_on (line 28)
#   4. Uncomment mysql_data in volumes section (line 64)
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

version: '3.4' # For compatibility with older Docker versions

services:
    new-api:
      image: calciumion/new-api:latest
      # 或自行构建：build: .
      restart: always
      ports:
        - "3000:3000"
      environment:
        SQL_DSN: "postgresql://root:${DB_PASSWORD}@postgres:5434/new-api"
        REDIS_CONN_STRING: "redis://redis"
        # SESSION_SECRET: "${SESSION_SECRET}"
        TZ: Asia/Shanghai
      volumes:
        - ./data:/data
        - ./logs:/app/logs
      depends_on:
        - redis
        - postgres
      healthcheck:
        test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3

    redis:
      image: redis:alpine
      restart: always

    postgres:
      image: postgres:15-alpine
      restart: always
      environment:
        POSTGRES_USER: root
        POSTGRES_PASSWORD: "${DB_PASSWORD}"
        POSTGRES_DB: new-api
      volumes:
        - pg_data:/var/lib/postgresql/data

  volumes:
    pg_data:
